<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolarFlow — offline</title>
    <link rel="icon" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1f3a" />
    <style>
      /* Standalone by necessity: this page must render with no network, so it
         cannot depend on the app's stylesheet being in cache. */
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #0b1f3a;
        color: #f4f7fb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main { max-width: 26rem; width: 100%; }
      h1 { font-size: 1.35rem; margin: 0 0 0.75rem; }
      .card {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 0.85rem;
        padding: 1.1rem 1.15rem;
        margin: 1rem 0;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        opacity: 0.7;
        margin: 0 0 0.35rem;
      }
      .headline { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.5rem; }
      .dim { opacity: 0.72; font-size: 0.9rem; }
      .stamp {
        background: #ffb703;
        color: #23180a;
        border-radius: 999px;
        padding: 0.2rem 0.6rem;
        font-size: 0.78rem;
        font-weight: 600;
        display: inline-block;
      }
      button {
        font: inherit;
        background: #ffb703;
        color: #23180a;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.7rem 1.1rem;
        font-weight: 600;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p class="dim">
        This is what we last loaded onto your phone. It is not live — the moment you have a signal
        again it will update itself.
      </p>
      <div class="card" id="snapshot" hidden>
        <p class="eyebrow" id="stage"></p>
        <p class="headline" id="headline"></p>
        <p class="dim" id="address"></p>
        <p class="dim" id="estimate"></p>
        <p><span class="stamp" id="stamp"></span></p>
      </div>
      <p class="dim" id="empty">
        We have nothing stored on this device yet. Open the app once with a connection and your
        project status will be available offline from then on.
      </p>
      <button type="button" onclick="location.replace('/portal')">Try again</button>
    </main>
    <script>
      /* The snapshot the app itself stored, with a visible age. The device is a
         read cache and never the authoritative copy (spec §0, §5). */
      try {
        var raw = localStorage.getItem('sf.snapshot');
        if (raw) {
          var s = JSON.parse(raw);
          if (s && s.headline) {
            document.getElementById('stage').textContent = s.stageLabel || '';
            document.getElementById('headline').textContent = s.headline;
            document.getElementById('address').textContent = s.address || '';
            document.getElementById('estimate').textContent = s.estimate
              ? 'Estimated completion ' + s.estimate
              : '';
            var mins = Math.round((Date.now() - new Date(s.savedAt).getTime()) / 60000);
            var age =
              mins < 2
                ? 'updated just now'
                : mins < 60
                  ? 'updated ' + mins + ' minutes ago'
                  : mins < 1440
                    ? 'updated ' + Math.round(mins / 60) + ' hours ago'
                    : 'updated ' + Math.round(mins / 1440) + ' days ago';
            document.getElementById('stamp').textContent = age;
            document.getElementById('snapshot').hidden = false;
            document.getElementById('empty').hidden = true;
          }
        }
      } catch (e) {
        /* private mode, or no storage — the empty message is the right answer */
      }
      /* Reconnecting takes them straight back to the live app. */
      window.addEventListener('online', function () {
        location.replace('/portal');
      });
    </script>
  </body>
</html>
